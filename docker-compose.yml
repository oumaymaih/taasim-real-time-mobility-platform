# =============================================================================
# TaaSim — Big Data Urban Mobility Platform
# Docker Compose v3.8 — Single-Workstation Academic Deployment
# Stack: Kafka (KRaft) · Flink · Spark · Cassandra · MinIO · Grafana
# =============================================================================
# RAM budget (16 GB workstation):
#   kafka 700m | flink-jm 900m | flink-tm 1.4g | spark-master 512m |
#   spark-worker 2g | cassandra 1.5g | minio 512m
#
# Run core stack: docker compose up -d
# Run UI tools:   docker compose --profile tools up -d kafka-ui
# Run everything: docker compose --profile tools --profile etl --profile api up -d
# =============================================================================

name: taasim

# ---------------------------------------------------------------------------
# Shared network — all services reach each other by service name
# ---------------------------------------------------------------------------
networks:
  taasim-net:
    driver: bridge

# ---------------------------------------------------------------------------
# Named volumes for persistence
# ---------------------------------------------------------------------------
volumes:
  kafka-data:
  cassandra-data:
  minio-data:
  flink-checkpoints:
  grafana-data:
  jupyter-notebooks:
  spark-logs:

# ---------------------------------------------------------------------------
# Reusable fragments
# ---------------------------------------------------------------------------
x-minio-env: &minio-env
  MINIO_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: taasim
  AWS_SECRET_ACCESS_KEY: taasim2024
  # S3A settings passed to Spark / Flink via their config files
  S3A_ENDPOINT: http://minio:9000
  S3A_ACCESS_KEY: taasim
  S3A_SECRET_KEY: taasim2024
  S3A_PATH_STYLE: "true"

x-spark-env: &spark-env
  SPARK_RPC_AUTHENTICATION_ENABLED: "no"
  SPARK_RPC_ENCRYPTION_ENABLED: "no"
  SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
  SPARK_SSL_ENABLED: "no"
  # S3A credentials forwarded to every Spark session
  AWS_ACCESS_KEY_ID: taasim
  AWS_SECRET_ACCESS_KEY: taasim2024

x-restart: &restart
  restart: unless-stopped

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # KAFKA — KRaft mode, single broker, no ZooKeeper
  # ---------------------------------------------------------------------------
  # Image: apache/kafka:3.7.0 ships with KRaft support out of the box.
  # CLUSTER_ID must be a base64-encoded 16-byte UUID.
  # Generate once with:  docker run --rm apache/kafka:3.7.0 \
  #   /opt/kafka/bin/kafka-storage.sh random-uuid
  # Then paste the result below.
  #
  # Two listeners:
  #   PLAINTEXT  → container-to-container on port 9092  (service name: kafka)
  #   EXTERNAL   → host-to-container on port 29092       (localhost:29092)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: taasim-kafka
    hostname: kafka
    <<: *restart
    networks:
      - taasim-net
    ports:
      - "9092:9092"    # internal (other containers)
      - "29092:29092"  # external (host machine / producers running on host)
      - "9101:9101"    # JMX metrics (optional, for monitoring)
    environment:
      # --- KRaft identity ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # --- Listeners ---
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Topic defaults ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # create topics explicitly
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168             # 7-day retention for replay
      KAFKA_LOG_SEGMENT_BYTES: 134217728         # 128 MB segments

      # --- KRaft cluster ID (CHANGE THIS — generate your own UUID) ---
      CLUSTER_ID: "b5nwziJ0TaKrcseyaDf0qg"

      # --- JVM tuning ---
      KAFKA_HEAP_OPTS: "-Xmx700m -Xms700m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20"

      # --- Metrics ---
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost

    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: >
        /opt/kafka/bin/kafka-broker-api-versions.sh
        --bootstrap-server kafka:9092 || exit 1
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # KAFKA UI — Provectus (optional, profile: tools)
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: taasim-kafka-ui
    profiles: [tools]
    <<: *restart
    networks:
      - taasim-net
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: taasim-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9101
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------------------
  # MINIO — S3-compatible object store
  # ---------------------------------------------------------------------------
  # Buckets to create after startup (see post-up checklist):
  #   taasim-raw      → raw/porto-trips/, raw/nyc-tlc/, raw/kafka-archive/
  #   taasim-curated  → curated/trips/, curated/demand-by-zone/
  #   taasim-ml       → ml/features/, ml/models/demand_v1/
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: taasim-minio
    hostname: minio
    <<: *restart
    networks:
      - taasim-net
    ports:
      - "9000:9000"   # S3 API  — s3a://taasim-raw/... points here
      - "9001:9001"   # MinIO console UI
    environment:
      MINIO_ROOT_USER: taasim
      MINIO_ROOT_PASSWORD: taasim2024
      MINIO_SITE_NAME: taasim-local
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------------------------
  # CASSANDRA — single node, CQL port exposed
  # ---------------------------------------------------------------------------
  # After startup create keyspace + tables (see post-up checklist).
  # Cassandra is slow to start — healthcheck retries are deliberately generous.
  # ---------------------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: taasim-cassandra
    hostname: cassandra
    <<: *restart
    networks:
      - taasim-net
    ports:
      - "9042:9042"   # CQL native transport — cqlsh localhost 9042
    environment:
      CASSANDRA_CLUSTER_NAME: TaaSimCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 256M
      # Disable unnecessary overhead for single-node dev
      CASSANDRA_NUM_TOKENS: 16
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 90s   # Cassandra needs up to 60s on first boot
    deploy:
      resources:
        limits:
          memory: 1536m

  # ---------------------------------------------------------------------------
  # FLINK JobManager
  # ---------------------------------------------------------------------------
  # Image: flink:1.18-scala_2.12 does NOT include S3A jars.
  # Option A (recommended for students): build a custom image.
  #   See services/flink/Dockerfile note at the bottom of this file.
  # Option B (quick hack): mount a local jars/ directory into
  #   /opt/flink/lib/ and add the jars there.
  #
  # Flink reads/writes Cassandra via flink-connector-cassandra JAR.
  # Flink writes checkpoints to MinIO via s3a:// — configure in flink-conf.yaml.
  # ---------------------------------------------------------------------------
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: taasim-flink-jm
    hostname: flink-jobmanager
    <<: *restart
    networks:
      - taasim-net
    ports:
      - "8081:8081"   # Flink Web UI
    command: jobmanager
    environment:
      <<: *minio-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 900m
        rest.address: 0.0.0.0
        rest.port: 8081
        # Checkpoints to MinIO
        state.backend: rocksdb
        state.checkpoints.dir: s3://taasim-checkpoints/flink/checkpoints
        state.savepoints.dir: s3://taasim-checkpoints/flink/savepoints
        # S3A / MinIO
        s3.endpoint: http://minio:9000
        s3.access-key: taasim
        s3.secret-key: taasim2024
        s3.path.style.access: true
        # Watermark interval
        pipeline.auto-watermark-interval: 200ms
        # Task slots
        taskmanager.numberOfTaskSlots: 3
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      # Uncomment to mount extra JARs (S3A, Cassandra connector):
      # - ./jars/flink:/opt/flink/lib/extra:ro
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 960m

  # ---------------------------------------------------------------------------
  # FLINK TaskManager
  # ---------------------------------------------------------------------------
  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    # image: taasim/flink:1.18
    container_name: taasim-flink-tm
    hostname: flink-taskmanager
    <<: *restart
    networks:
      - taasim-net
    command: taskmanager
    environment:
      <<: *minio-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1400m
        taskmanager.numberOfTaskSlots: 3
        # S3A / MinIO
        s3.endpoint: http://minio:9000
        s3.access-key: taasim
        s3.secret-key: taasim2024
        s3.path.style.access: true
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      # - ./jars/flink:/opt/flink/lib/extra:ro
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1500m

  # ---------------------------------------------------------------------------
  # SPARK Master (profile: etl)
  # ---------------------------------------------------------------------------
  # Image: bitnami/spark:3.5 ships with hadoop-aws and aws-java-sdk bundled.
  # You do NOT need to add S3A JARs manually — just set the env vars below.
  # Spark conf for s3a is set via SPARK_EXTRA_CLASSPATH or spark-defaults.conf.
  # ---------------------------------------------------------------------------
  spark-master:
    image: spark:3.5.0
    container_name: taasim-spark-master
    hostname: spark-master
    profiles: [etl]
    restart: unless-stopped
    networks:
      - taasim-net
    ports:
      - "8082:8080"
      - "7077:7077"
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    command: >
      /bin/bash -c "/opt/spark/sbin/start-master.sh &&
      tail -f /dev/null"

  # ---------------------------------------------------------------------------
  # SPARK Worker (profile: etl)
  # ---------------------------------------------------------------------------
  spark-worker:
    image: spark:3.5.0
    container_name: taasim-spark-worker
    hostname: spark-worker
    profiles: [etl]
    restart: unless-stopped
    networks:
      - taasim-net
    ports:
      - "8083:8081"
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8081
    command: >
      /bin/bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
      tail -f /dev/null"
    depends_on:
      - spark-master

  # ---------------------------------------------------------------------------
  # GRAFANA — with Cassandra plugin pre-installed
  # ---------------------------------------------------------------------------
  # The HadesArchitect-Cassandra-Plugin is the most stable free Cassandra
  # datasource plugin for Grafana.
  # GF_INSTALL_PLUGINS installs it automatically on first boot.
  # After startup: add datasource manually in UI (see post-up checklist).
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: taasim-grafana
    hostname: grafana
    <<: *restart
    networks:
      - taasim-net
    ports:
      - "3000:3000"   # Grafana UI — http://localhost:3000  admin/taasim2024
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: taasim2024
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "hadesarchitect-cassandra-datasource"
      # Install Cassandra datasource plugin on startup
      #GF_INSTALL_PLUGINS: "HadesArchitect-Cassandra-Plugin 0.4.5"
      #GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "HadesArchitect-Cassandra-Plugin"
      GF_LOG_LEVEL: warn
      
    volumes:
      - grafana-data:/var/lib/grafana
      # Optional: pre-provision datasources and dashboards
      # - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------------------
  # JUPYTER — PySpark + Kafka notebook environment (profile: tools)
  # ---------------------------------------------------------------------------
  # Includes: PySpark, kafka-python, cassandra-driver, boto3, pandas, etc.
  # Access: http://localhost:8888  (token printed in logs on first start)
  # ---------------------------------------------------------------------------
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: taasim-jupyter
    hostname: jupyter
    profiles: [tools]
    <<: *restart
    networks:
      - taasim-net
    ports:
      - "8888:8888"   # Jupyter Lab UI
    environment:
      <<: *minio-env
      JUPYTER_ENABLE_LAB: "yes"
      GRANT_SUDO: "yes"
      # Pre-configure Spark to talk to MinIO
      PYSPARK_SUBMIT_ARGS: >
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
        --conf spark.hadoop.fs.s3a.access.key=taasim
        --conf spark.hadoop.fs.s3a.secret.key=taasim2024
        --conf spark.hadoop.fs.s3a.path.style.access=true
        --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        pyspark-shell
    volumes:
      - jupyter-notebooks:/home/jovyan/work
      - ./jobs:/home/jovyan/work/jobs:ro
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1200m

  # ---------------------------------------------------------------------------
  # FASTAPI — application service placeholder (profile: api)
  # ---------------------------------------------------------------------------
  # This is a placeholder. Build your FastAPI app in services/fastapi/.
  # The Dockerfile is NOT provided — create it yourself (see note below).
  # Uncomment image: line and remove build: once image is pushed to a registry.
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: ./services/fastapi
      dockerfile: Dockerfile
    # image: taasim/fastapi:latest  # use after building
    container_name: taasim-fastapi
    hostname: fastapi
    profiles: [api]
    <<: *restart
    networks:
      - taasim-net
    ports:
      - "8000:8000"   # FastAPI — http://localhost:8000/docs
    environment:
      <<: *minio-env
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: taasim
      JWT_SECRET_KEY: "change-me-in-production"
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      PYTHONUNBUFFERED: "1"
    depends_on:
      cassandra:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------------------
  # KAFKA CONNECT — S3 Sink placeholder (optional, uncomment to enable)
  # ---------------------------------------------------------------------------
  # Streams raw.gps and raw.trips to MinIO raw/kafka-archive/ in Parquet.
  # Requires: confluentinc/kafka-connect-s3 connector plugin.
  # Easiest approach: use Confluent's cp-kafka-connect image which bundles it.
  # ---------------------------------------------------------------------------
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.1
    container_name: taasim-kafka-connect
    hostname: kafka-connect
    profiles: [tools]
    networks:
      - taasim-net
    ports:
      - "8084:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: taasim-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      AWS_ACCESS_KEY_ID: taasim
      AWS_SECRET_ACCESS_KEY: taasim2024

    command:
      - bash
      - -c
      - |
        confluent-hub install --no-prompt confluentinc/kafka-connect-s3:latest
        /etc/confluent/docker/run

    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started

    restart: unless-stopped

